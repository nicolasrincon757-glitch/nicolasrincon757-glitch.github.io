# Workflow para construir y desplegar el sitio Astro a GitHub Pages
name: Deploy to GitHub Pages

on:
  # Se ejecuta cada vez que haces push a la rama principal
  push:
    branches: [main]
  # Te permite lanzarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

# Permisos necesarios para que el workflow pueda publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se ejecuten despliegues en paralelo; deja que termine el actual
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar, construir y subir el sitio
        uses: withastro/action@v3
        # Por defecto usa Node 20 y detecta automáticamente
        # npm / yarn / pnpm según el lockfile del proyecto.
        # with:
        #   node-version: 20
        #   package-manager: pnpm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4